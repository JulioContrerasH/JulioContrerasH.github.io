    peru:
      title: Perú
      text: Nací en Mala, Cañete. Estudié Ingeniería Geográfica en la UNMSM y salí primer puesto de mi promoción en 2022. Hice mapas y datos GIS para estudios ambientales en INSIDEO. Mi tesis armonizó Landsat MSS (1972-1999) con IA. Después vinieron Andes DataCube y CloudSEN12+.
    valencia:
      title: Valencia
      text: >-
        En septiembre de 2025 empecé el doctorado en la Universitat de València,
        en el grupo ISP/IPL del Parque Científico. Investigo cómo detectar nubes
        con deep learning en registros satelitales históricos. En el camino
        entrené y evalué superresolución: SEN2NAIP, SEN2SR y SEN2NEON.
    ahora:
      title: Ahora
      text: Sigo investigando en Asterisk Labs. Trabajo en TACO, el formato para empaquetar datasets de observación de la Tierra listos para IA. CubeXpress salió de bajar cubos de GEE sin dolor. Y ahora ando metido en MethaneSET, midiendo fugas de metano con varios satélites.

