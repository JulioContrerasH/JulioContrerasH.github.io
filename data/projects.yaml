# Proyectos de Julio. Única fuente de verdad para la web.
#
# type:        ground = tiene lugar geográfico | orbit = herramienta sin lugar
# chapter:     peru | valencia | ahora
# chain_stage: limpiar | mejorar | mover-y-guardar | compartir | usar
# include:     true = va a la web | false = fuera por ahora (decisión de Julio)
# status:      legacy | public | vault | julio
# image:       captura o figura real del proyecto (assets locales)
# footprint:   bbox aproximado [lon_min, lat_min, lon_max, lat_max] para pintar el área
# global:      cobertura mundial (se pinta el globo entero)
#
# Los campos con _en son la versión inglesa (la web es EN por defecto).
# Decisiones de la ronda 1 (julio): entran todos los papers, TACO sí,
# CubeXpress sí, Andes DataCube sí; geozl, rumi y ELLIOT fuera por ahora.

