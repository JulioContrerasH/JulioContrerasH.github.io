    peru:
      title: Peru
      text: I was born in Mala, Cañete. I studied Geographical Engineering at UNMSM and finished top of my class in 2022. I made maps and GIS data for environmental studies at INSIDEO. My thesis harmonized Landsat MSS (1972-1999) with AI. Then came Andes DataCube and CloudSEN12+.
    valencia:
      title: Valencia
      text: >-
        In September 2025 I started my PhD at the Universitat de València, in
        the ISP/IPL group at the Science Park. I research deep learning cloud
        detection for historical satellite records. Along the way I trained and
        evaluated super-resolution: SEN2NAIP, SEN2SR and SEN2NEON.
    ahora:
      title: Now
      text: I keep researching at Asterisk Labs. I work on TACO, the format for packaging AI-ready Earth Observation datasets. CubeXpress came out of downloading GEE cubes without pain. And now I am deep into MethaneSET, measuring methane leaks with several satellites.
