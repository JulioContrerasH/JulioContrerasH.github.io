bio:
  es: >-
    Ingeniero geógrafo de Mala, Cañete (Perú) y doctorando en la Universitat de
    València. Empecé en Perú haciendo mapas y datos geográficos para estudios
    ambientales; después vinieron Andes DataCube y CloudSEN12+. Ahora trabajo en
    una idea simple: que los datos satelitales sirvan. Limpio nubes, mejoro la
    resolución, comprimo y empaqueto datos, y los uso para ver agua, glaciares y
    metano.
  en: >-
    Geographical engineer from Mala, Cañete (Peru) and PhD student at the
    Universitat de València. I started in Peru making maps and geographic data
    for environmental studies; then came Andes DataCube and CloudSEN12+. Now I
    work on one simple idea: satellite data that gets used. I clean clouds,
    improve resolution, compress and package data, and use it to look at water,
    glaciers and methane.
  status: borrador
  tone: informal, primera persona, frases cortas   # julio
  en_legacy: >-
    I am a professional with two years in web development and data science,
    focusing on spatial analysis and big data, especially in scraping and
    managing remote sensing data. I'm proficient with R, Python, Google Earth
    Engine, and Planetary Computer, and in web development with React, HUGO,
    recently shifting to Astro with Tailwind CSS. I aim to transition into
    academia, where my passion and ambitions drive me to innovate in Deep
    Learning and Remote Sensing. My work ethic is grounded in responsibility,
    commitment, proactivity, and efficiency in multidisciplinary teams.
  legacy_quote: "I envision my code, and then I code my vision - Ada Lovelace"

